[package]
name = "ak-kit"
version = "0.1.0"
edition = "2021"
description = "Bo mach AK MCU KIT cho cac bai demo Rust: xung nhip, LED, cong COM, panic"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["stm32l151cb-a", "time-driver-tim2", "exti"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
critical-section = "1"
embedded-graphics = "0.8.2"
